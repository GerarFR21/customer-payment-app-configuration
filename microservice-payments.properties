spring.application.name=payments-microservice
server.port=8082
management.endpoints.web.exposure.include=refresh,health,info

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=payments.exchange
app.rabbitmq.queue=payments.new.q
app.rabbitmq.routingKey=payments.created

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/payments_db
spring.datasource.username=payments_user
spring.datasource.password=${PAYMENTS_DB_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true