spring.application.name=microservice-customers
server.port=8083

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/customers_db
spring.datasource.username=customers_user
spring.datasource.password=${CUSTOMERS_DB_PASSWORD}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true